name: Rockchip 24.10.x

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "24.10.5"
        type: choice
        options:
          - 24.10.0
          - 24.10.1
          - 24.10.2
          - 24.10.3
          - 24.10.4
          - 24.10.5
      profile:
        type: choice
        description: |
          输入 软路由型号 可选值如下：
        options:
          - linkease_easepi-r1
          - ariaboard_photonicat
          - armsom_sige3
          - armsom_sige7
          - cyber_cyber3588-aib
          - ezpro_mrkaio-m68s
          - firefly_roc-rk3328-cc
          - firefly_roc-rk3568-pc
          - friendlyarm_nanopc-t4
          - friendlyarm_nanopc-t6
          - friendlyarm_nanopi-r2c
          - friendlyarm_nanopi-r2c-plus
          - friendlyarm_nanopi-r2s
          - friendlyarm_nanopi-r3s
          - friendlyarm_nanopi-r4s
          - friendlyarm_nanopi-r4se
          - friendlyarm_nanopi-r4s-enterprise
          - friendlyarm_nanopi-r5c
          - friendlyarm_nanopi-r5s
          - friendlyarm_nanopi-r6c
          - friendlyarm_nanopi-r6s
          - huake_guangmiao-g4c
          - lunzn_fastrhino-r66s
          - lunzn_fastrhino-r68s
          - lyt_t68m
          - pine64_rock64
          - pine64_rockpro64
          - radxa_cm3_io
          - radxa_e25
          - radxa_e52c
          - radxa_rock-3a
          - radxa_rock-3b
          - radxa_rock-3c
          - radxa_rock-5a
          - radxa_rock-5b
          - radxa_rock-pi-4a
          - radxa_rock-pi-e
          - radxa_rock-pi-s
          - radxa_zero-3e
          - radxa_zero-3w
          - sinovoip_bpi-r2-pro
          - xunlong_orangepi-5
          - xunlong_orangepi-5-plus
          - xunlong_orangepi-r1-plus
          - xunlong_orangepi-r1-plus-lts
        required: true
        default: 'friendlyarm_nanopi-r2s'
      custom_router_ip:
        description: "请设置软路由的管理地址(注意仅对多网口软路由有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "10.8.8.1"
      rootfs_partsize:
        description: '设置软件包大小 单位(MB)'
        required: true
        default: '1024'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      profile: ${{ steps.set-env.outputs.profile }}
      custom_router_ip: ${{ steps.set-env.outputs.custom_router_ip }}
      rootfs_partsize: ${{ steps.set-env.outputs.rootfs_partsize }}
      build_tag: ${{ steps.set-env.outputs.build_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        id: set-env
        run: |
          echo "profile=${{ github.event.inputs.profile || 'friendlyarm_nanopi-r2s' }}" >> $GITHUB_OUTPUT
          echo "custom_router_ip=${{ github.event.inputs.custom_router_ip || '10.8.8.1' }}" >> $GITHUB_OUTPUT
          echo "rootfs_partsize=${{ github.event.inputs.rootfs_partsize || '1024' }}" >> $GITHUB_OUTPUT
          echo "build_tag=${{ github.event.inputs.profile || 'friendlyarm_nanopi-r2s' }}" >> $GITHUB_OUTPUT

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/rockchip/build24.sh
      
      - name: Save Custom Router IP into OpenWrt files
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ steps.set-env.outputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "You set the Rockchip router management address to:${{ steps.set-env.outputs.custom_router_ip }}"
      
      - name: Upload prepared files
        uses: actions/upload-artifact@v4
        with:
          name: prepared-files
          path: |
            ${{ github.workspace }}/custom/
            ${{ github.workspace }}/shell/custom-packages.sh

  build:
    runs-on: ubuntu-22.04
    needs: prepare
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download prepared files
        uses: actions/download-artifact@v4
        with:
          name: prepared-files
          path: ${{ github.workspace }}

      - name: Build Rockchip ImmortalWrt 24.10.x
        run: |
          luci_version="${{ github.event.inputs.luci_version }}"
          profile="${{ needs.prepare.outputs.profile }}"
          rootfs_partsize="${{ needs.prepare.outputs.rootfs_partsize }}"

          luci_version="${luci_version:-24.10.5}"
          profile="${profile:-friendlyarm_nanopi-r2s}"
          rootfs_partsize="${rootfs_partsize:-1024}"

          echo "Building for profile: $profile"
          echo "Using LUCI version: $luci_version"

          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
            -v "${{ github.workspace }}/arch/arch.conf:/home/build/immortalwrt/files/etc/opkg/arch.conf" \
            -v "${{ github.workspace }}/rockchip/imm.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/rockchip/build24.sh:/home/build/immortalwrt/build.sh" \
            -e PROFILE=$profile \
            -e ROOTFS_PARTSIZE=$rootfs_partsize \
            immortalwrt/imagebuilder:rockchip-armv8-openwrt-${luci_version} /bin/bash /home/build/immortalwrt/build.sh
          ls ${{ github.workspace }}/bin/targets/rockchip/armv8/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ${{ github.workspace }}/bin/

  release:
    runs-on: ubuntu-22.04
    needs: [prepare, build]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ${{ github.workspace }}/bin/

      - name: Create info
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 Router Information

          - ✳️ **Router Model**: ${{ needs.prepare.outputs.profile }}
          - 🏠 **Management IP**: ${{ needs.prepare.outputs.custom_router_ip }}
          - 👤 **Username**: root
          - 🔑 **Password**: none
          EOF

      - name: Upload ImmortWrt as release assets
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ needs.prepare.outputs.build_tag }}
          name: ${{ needs.prepare.outputs.build_tag }}
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/rockchip/armv8/*.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
